name: apaas-mes
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: mes_dev
      POSTGRES_PASSWORD: mes_dev_local
      POSTGRES_DB: mes
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - mes_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mes_dev -d mes"]
      interval: 3s
      retries: 10
volumes:
  mes_pgdata:
